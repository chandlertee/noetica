version: 2
updates:
  # Python dependencies (pyproject / uv).
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python-deps:
        patterns: ["*"]
    open-pull-requests-limit: 5
    labels: ["dependencies"]

  # GitHub Actions used by CI.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "ci"]

  # Base images in the Dockerfiles.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "docker"]
    ignore:
      # The training image's CUDA base must stay aligned with torch's bundled
      # CUDA runtime — don't auto-bump it across minor/major versions.
      - dependency-name: "nvidia/cuda"
        update-types:
          ["version-update:semver-major", "version-update:semver-minor"]
