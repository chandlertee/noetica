name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-type-test:
    name: lint · type · test (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync (core + dev, no torch)
        run: uv sync --extra dev --python ${{ matrix.python }}

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy

      - name: Pytest + coverage
        run: uv run pytest

      - name: Eval regression gate (no model)
        run: uv run python -m noetica.eval.run --check --ci

  serve-installs-light:
    name: serve installs without train extras
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Install core only and assert torch is absent
        run: |
          uv venv
          uv pip install .
          # The core install must not pull torch/CUDA.
          if uv run python -c "import importlib.util,sys; sys.exit(0 if importlib.util.find_spec('torch') is None else 1)"; then
            echo "ok: torch not present in core install"
          else
            echo "::error::torch is present in the core install — keep training deps behind [train]"; exit 1
          fi
      - name: Import + CLI smoke test
        run: |
          uv run python -c "import noetica, noetica.serve.main, noetica.eval.run, noetica.train.data"
          uv run noetica --version

  docker-build:
    name: docker build (serve image)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build serve image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: noetica-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  gitleaks:
    name: secret scan (full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
