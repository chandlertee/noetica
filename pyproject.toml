[project]
name = "noetica"
version = "1.0.0"
description = "A fully self-hosted local-AI stack over Ollama: chat, a structured-output API, and a fine-tune → serve → chat loop."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = [
    "ollama", "local-llm", "fine-tuning", "qlora", "fastapi",
    "self-hosted", "open-webui", "llm", "rag", "chatbot",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Core deps — what `noetica serve` + the API need. Deliberately laptop-friendly:
# no torch, no CUDA. A user can run chat + API without ever pulling training deps.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "jsonschema>=4.23",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
# Development + the eval harness. Eval itself runs on core deps (httpx); these
# are the test/lint/type tools.
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.11",
]

# Heavy / GPU training stack — installed only via `pip install .[train]`.
# These pull torch/CUDA and are not needed to chat or serve. Unsloth's QLoRA
# path wants an NVIDIA GPU; see noetica/train/README.md for the CPU/Colab route.
train = [
    "torch>=2.3",
    "transformers>=4.44",
    "datasets>=2.20",
    "trl>=0.9",
    "peft>=0.12",
    "accelerate>=0.33",
    "unsloth>=2024.8 ; platform_system == 'Linux'",
]

[project.scripts]
noetica = "noetica.cli:main"

[project.urls]
Homepage = "https://github.com/chandlertee/noetica"
Repository = "https://github.com/chandlertee/noetica"
Changelog = "https://github.com/chandlertee/noetica/blob/main/CHANGELOG.md"
Issues = "https://github.com/chandlertee/noetica/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["noetica"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=noetica.serve --cov-report=term-missing"

[tool.coverage.run]
branch = true
omit = ["noetica/train/*", "noetica/eval/*"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Colab notebooks follow cell-local import conventions (google.colab, %pip) that
# don't fit module linting.
extend-exclude = ["notebooks", "*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = [
    "E501",  # line length handled by the formatter
    "B008",  # FastAPI's `Depends(...)` in defaults is the intended idiom
]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = false
ignore_missing_imports = true
# The optional train module imports unsloth/torch which aren't installed in the
# core/dev environment; don't fail type-checking on their absence.
exclude = ["noetica/train/", "build/", "dist/"]
files = ["noetica/serve", "noetica/eval", "noetica/cli.py", "noetica/__init__.py", "noetica/__main__.py"]
